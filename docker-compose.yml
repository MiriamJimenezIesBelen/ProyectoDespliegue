version: '3.8'
services:
  # 1. La Base de Datos
  db:
    image: mysql:8.0
    container_name: impacto-db
    environment:
      MYSQL_DATABASE: impactovisibledb
      MYSQL_ROOT_PASSWORD: root
    networks:
      - impacto-network

  # 2. El Backend (Spring Boot)
  backend:
    build: . # Busca el Dockerfile del que hablamos antes
    container_name: impacto-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/impactovisibledb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db
    networks:
      - impacto-network
    ports:
      - "8080:8080"

  # 3. El Frontend (Angular) - ¡Opcional pero recomendado!
  # Si aún no tienes Dockerfile para Angular, puedes desplegarlo aparte,
  # pero lo ideal es meterlo aquí también.
networks:
  impacto-network: